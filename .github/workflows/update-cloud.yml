name: 데이터 자동 갱신 (클라우드 冗長)

# 집 PC 없이 완전 자동. KOSIS는 GitHub 러너의 Azure IP 일부를 간헐 차단해
# 단일 러너면 ~12.5% 확률로 그날 전면 실패한다(2026-07 실측). 쿼리 크기 문제가
# 아니라 IP 룰렛이라 청크 쪼개기로는 못 푼다. 대신 병렬 3러너(=서로 다른 IP)를
# 띄워 오염 안 된 러너의 산출물만 커밋한다 — 3러너 동시 실패 확률 ≈0.2%.
on:
  schedule:
    # 주간 발표(목)가 정오보다 늦게 R-ONE에 반영되는 경우가 있어(2026-07-23 13시에도
    # 미반영 확인) 목요일은 오후·저녁 2회로 잡는다. 놓쳐도 다음 일일 런이 흡수.
    - cron: '0 11 * * *'   # 매일 20:00 KST — 월간·KOSIS 셀프힐 + 목 저녁 주간 반영
    - cron: '0 7 * * 4'    # 목 16:00 KST — 주간 발표 반영 1차 시도
  workflow_dispatch: {}
  # push 트리거는 두지 않는다. 워크플로를 한 줄만 고쳐도 3러너 40분 배치가 돌고,
  # 예정에 없던 시각에 데이터가 커밋된다(산출물 채택 로직 검증 때 임시로 썼고
  # 검증이 끝나 제거). 수동 확인이 필요하면 workflow_dispatch를 쓴다.

permissions:
  contents: write
  issues: write          # 매 회차 결과 보고를 전용 이슈에 코멘트로 남긴다(아래 '결과 보고')

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 클라우드→한국 지연으로 배치가 ~40분. 여유 있게 60.
    strategy:
      fail-fast: false      # 한 러너가 나쁜 IP로 죽어도 나머지는 계속
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: IP 프리플라이트 (나쁜 IP는 이 러너 조용히 스킵)
        id: pre
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
        run: |
          # 나쁜 IP면 전체 배치가 KOSIS 호출마다 60s×3 재시도로 수십 분 hang한다.
          # 작은 KOSIS 호출 하나로 IP 건강성을 15초 내 판정. 나쁜 IP는 '실패'가 아니라
          # 'ok=false'로 표시해 이 러너만 조용히 스킵한다 — 다른 러너가 처리하므로
          # 잡을 red로 만들지 않는다(3러너 중 일부는 늘 나쁜 IP를 뽑는다).
          if [ -z "$KOSIS_API_KEY" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "KOSIS 시크릿 없음"; exit 0; fi
          if python - << 'PY'
          import os, sys, urllib.parse, urllib.request
          u='https://kosis.kr/openapi/Param/statisticsParameterData.do?'+urllib.parse.urlencode(
            dict(method='getList',apiKey=os.environ['KOSIS_API_KEY'],format='json',jsonVD='Y',
                 orgId='408',tblId='DT_304004_WEEK_001_B',objL1='ALL',itmId='ALL',prdSe='F',
                 startPrdDe='20260601',endPrdDe='20260620'))
          try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              urllib.request.urlopen(req,timeout=15).read()
          except Exception as e:
              print('나쁜 IP:',type(e).__name__); sys.exit(1)
          PY
          then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "프리플라이트 OK — 좋은 IP"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "이 러너 나쁜 IP — 배치 스킵(정상, 다른 러너가 처리)"
          fi

      - name: 데이터 갱신 시도 (러너 ${{ matrix.n }})
        id: upd
        if: steps.pre.outputs.ok == 'true'
        env:
          KOSIS_API_KEY:  ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
          ECOS_API_KEY:   ${{ secrets.ECOS_API_KEY || secrets.ECOS }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
          RONE_API_KEY:   ${{ secrets.RONE_API_KEY || secrets.RONE }}
          PYTHONUNBUFFERED: '1'   # 진행 로그 실시간 스트리밍(취소돼도 어디까지 갔는지 보이게)
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then
            echo "::warning::KOSIS 시크릿 없음 — 건너뜀"; exit 0
          fi
          set +e
          python tools/update_adv_data.py --update
          rc=$?
          set -e
          echo "batch rc=$rc"
          # 오염 판정: 프리플라이트가 KOSIS IP 건강성을 이미 보장하므로, 여기서는
          # 배치 exit 코드만 본다. rc!=0 = 크래시 또는 대량 실패(rc 3) = 폐기.
          # rc==0이면 커밋 — 비핵심 소스(ECOS·DATAGO)가 몇 개 실패해도 해당 값은
          # 직전 유지될 뿐이라 로컬 배치와 동일하게 부분 갱신을 커밋한다.
          if [ "$rc" -ne 0 ]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "배치 rc=$rc — 산출물 폐기(다음 회차 흡수)"
          else
            python tools/split_data.py
            echo "clean=true" >> "$GITHUB_OUTPUT"
            [ -s .fetch_failed ] && echo "참고: 비핵심 소스 실패 -> $(cat .fetch_failed) (직전 값 유지)"
            echo "clean 러너 — 산출물 업로드"
          fi

      - name: 산출물 업로드 (clean 러너만)
        if: steps.upd.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.n }}
          path: |
            data.js
            data-core.js
            data-rest.json
            data-trend.json
            data-sgg.json
            data-size.json
            .stats_changed
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true   # .stats_changed(변경 내역, 뉴스레터용) 포함

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clean 산출물 내려받기
        uses: actions/download-artifact@v4
        with:
          path: _art
          pattern: data-*
          merge-multiple: false
        continue-on-error: true    # clean 러너 0개면 아무것도 안 받음

      - name: 변경 있으면 커밋·푸시
        run: |
          # ── 항목별 결과 기록 ────────────────────────────────────────────
          # 이 잡은 중간에 `exit 1`로 끊기는 지점이 여럿이라, 결과를 마지막에
          # 몰아 쓰면 정작 실패한 회차의 보고가 안 나간다. 그래서 각 단계가
          # 지나갈 때마다 파일에 즉시 적고, 뒤의 `if: always()` 스텝이 그걸 읽어
          # 보고한다(2026-08-08 마케팅 세션 요청 — 성공일 때도 알림이 필요).
          R="$GITHUB_WORKSPACE/_batch_report.txt"
          : > "$R"
          rep() { echo "$1" >> "$R"; echo "REPORT $1"; }
          # ⚠️ clean 산출물이 서로 다를 수 있다 — weekly/monthly는 실패해도 rc=0
          # (직전 값 유지 후 부분 갱신)이라, R-ONE 타임아웃을 맞은 러너도 clean으로
          # 올라온다. 예전엔 head -1로 아무거나 골라서, 7/27을 받아온 러너 2·3을
          # 두고 타임아웃 난 러너 1(7/20)을 채택해 한 주 묵은 데이터를 커밋했다
          # (2026-07-30 실사고). 그래서 '가장 최신 주간/월간을 가진 산출물'을 고른다.
          # 산출물별 최신 weekly(YYYY-MM-DD)를 뽑아 가장 신선한 것을 고른다.
          # 파이썬 heredoc은 YAML 블록 들여쓰기를 깨므로 순수 셸로 짠다.
          SRC=""; BEST=""; BESTMO=""; BESTSL=""
          for d in _art/data-*; do
            [ -f "$d/data-core.js" ] || continue
            wk=$(grep -oE '"p":"[0-9]{4}-[0-9]{2}-[0-9]{2}"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            # 월간도 같은 아티팩트에서 읽는다 — 2026-08-06부터 ADV.monthly가
            # data-core.js에 실린다(홈 통합표가 그린다). 주간이 동률일 때 월간만
            # 뒤처진 러너가 채택되던 구멍을 막는 2차 정렬 키다.
            mo=$(grep -oE '"p":"[0-9]{4}-[0-9]{2}"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}-[0-9]{2}' | sort | tail -1)
            # 3차 키: 공급 축(ADV.sido.L = 준공 실적 마지막 완결 분기). 주간·월간이
            # 동률이면 공급이 뒤진 러너가 그대로 이겨, 새 분기 준공·착공을 그 회차에
            # 못 실었다(2026-08-08 감사에서 합성 아티팩트로 재현).
            sl=$(grep -oE '"L":"[0-9]{4}Q[1-4]"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}Q[1-4]' | sort | tail -1)
            echo "후보 $d: weekly=${wk:--} monthly=${mo:--} sidoL=${sl:--}"
            newer=0
            if [ -n "$wk" ]; then
              if [ -z "$BEST" ] || [ "$wk" \> "$BEST" ]; then newer=1
              elif [ "$wk" = "$BEST" ] && [ -n "$mo" ] && [ "$mo" \> "$BESTMO" ]; then newer=1
              elif [ "$wk" = "$BEST" ] && [ "$mo" = "$BESTMO" ] && [ -n "$sl" ] && [ "$sl" \> "$BESTSL" ]; then newer=1
              fi
            fi
            if [ "$newer" = "1" ]; then BEST="$wk"; BESTMO="$mo"; BESTSL="$sl"; SRC="$d"; fi
          done
          # weekly를 하나도 못 읽었으면(구조 변경 등) 예전처럼 아무거나
          [ -z "$SRC" ] && SRC=$(ls -d _art/data-* 2>/dev/null | head -1 || true)
          NRUN=$(ls -d _art/data-* 2>/dev/null | wc -l | tr -d ' ')
          if [ -z "$SRC" ]; then
            rep "❌ 러너 0/3 clean — 이번 회차 갱신 없음 (KOSIS IP 룰렛, 다음 회차가 흡수)"
            echo "::warning::clean 러너 0개 — 이번 회차 갱신 실패(다음 회차 새 IP가 흡수)"
            exit 0
          fi
          rep "✅ 러너 ${NRUN}/3 clean · 채택 주간 ${BEST:--} / 월간 ${BESTMO:--} / 공급 ${BESTSL:--}"
          # 비교 축은 주간(1순위) + 월간(동률일 때 2순위)이다. 2026-08-06 이후
          # data-core.js에 ADV.monthly가 실려 같은 아티팩트에서 둘 다 읽는다 —
          # 그 전에는 월간 축이 없어 '주간 동률이면 앞 후보 유지'였다(2026-08-07 정정).
          echo "채택: $SRC (주간 $BEST · 월간 ${BESTMO:--})"
          # split_data.py가 내는 5파일을 모두 옮긴다. data-sgg/data-size가 빠지면
          # checkout된 옛 파일이 그대로 남아 '지연 로드만 몇 주 묵는' 부분배포가 된다
          # (2026-08-04 감사: 두 파일은 어떤 목록에도 없어 사람이 손으로만 커밋돼 왔다).
          cp "$SRC/data.js" "$SRC/data-core.js" "$SRC/data-rest.json" "$SRC/data-trend.json" .
          for f in data-sgg.json data-size.json; do
            [ -f "$SRC/$f" ] && cp "$SRC/$f" . || echo "::warning::$f 산출물 없음(구 러너?) — 기존 파일 유지"
          done
          # 정적 페이지(zone·지표)는 data.js를 구워 만들므로 새 데이터로 재생성해
          # 함께 커밋한다. 로컬 스케줄러가 꺼진 PC-less 체제에선 여기가 유일한
          # 재생성 지점. 생성기는 stdlib만 쓰고(러너 기본 python3), 날짜를 데이터
          # 시점에서 유도하므로 데이터가 같으면 diff도 없다. 실패해도 데이터
          # 커밋은 막지 않는다(::warning만, 다음 회차 재시도).
          # ── 검증 게이트 ────────────────────────────────────────────────
          # PC-less 체제에선 이 워크플로가 유일한 배포 경로다. 예전엔 여기에 검증이
          # 전혀 없어서, 한쪽 구현만 고친 커밋이 들어와도 옛 산식으로 존 페이지를
          # 구워 그대로 배포했다(홈 순위표와 /zone/ 상세가 다른 숫자를 표시).
          # 그래서 생성 '전에' 두 가지를 막는다:
          #   1) pytest — 코드가 깨진 채로 페이지를 굽지 않는다
          # (2026-08-06: 옛 게이트 2번 check_dual_calc는 폐지. 점수를 sido_zones.py가
          #  빌드 시점에 계산해 ADV.sido로 싣고 홈·지역 페이지가 읽기만 하므로
          #  갈릴 구현 자체가 없다.)
          # 실패하면 아무것도 커밋하지 않고 잡을 red로 만든다.
          # (데이터 갱신은 하루 밀리지만, 틀린 숫자가 조용히 나가는 것보다 낫다.
          #  실패는 GitHub 알림으로 사람에게 전달된다.)
          # ⚠️ '테스트가 실패했다'와 '테스트를 돌릴 수 없었다'를 반드시 구분한다.
          # 둘을 뭉뚱그리면 pip 일시 장애 같은 인프라 문제가 매일의 데이터 갱신을
          # 영구히 막는다(게이트가 오히려 사고가 된다). 도구가 없으면 경고만 남기고
          # 넘어가되, 도구가 있는데 테스트가 깨지면 배포를 멈춘다.
          # pillow는 공유 카드(make_weekly_share)가 쓴다. 여기서 함께 깔지 않으면
          # 그 스텝이 매 회차 ModuleNotFoundError로 죽는데 `|| echo ::warning`이라
          # 배치는 green으로 끝난다 — 2026-08-04 이 스텝을 넣은 뒤 4회 연속 실패했고
          # /weekly/의 og:image가 2026-07-18 지도에 3주간 고정돼 있었다.
          python3 -m pip install --quiet pytest pillow || true
          if python3 -c "import pytest" 2>/dev/null; then
            if ! python3 -m pytest tools/tests/ -q; then
              rep "❌ 테스트 실패 — 배포 중단(코드 회귀). 데이터 커밋 안 함"
              echo "::error::pytest 실패 — 배포 중단(코드 회귀). 데이터는 커밋하지 않는다."
              exit 1
            fi
            rep "✅ 테스트"
          else
            rep "⚠️ 테스트 건너뜀 — pytest 설치 실패(인프라)"
            echo "::warning::pytest를 설치하지 못해 테스트를 건너뛴다(인프라 문제)."
          fi
          echo "검증 통과 — 페이지 생성으로 진행"
          # ───────────────────────────────────────────────────────────────
          # ⚠️ 경고로 넘기지 않는다. make_sido_pages는 '점수와 표의 시점이 어긋났다'는
          # 게이트를 들고 있는데, 실패를 흡수하면 그 게이트가 막으려던 데이터(data.js·
          # zone·sitemap)를 그대로 커밋해 버린다 — 로컬 배치(run_weekly_update.bat)는
          # 같은 실패에 전량 중단이라 두 배치의 안전 동작이 정반대였다(2026-08-07 감사).
          if ! python3 tools/make_sido_pages.py; then
            rep "❌ 지역페이지 실패 — 점수·표 시점 불일치 의심. 커밋 안 함"
            echo "::error::make_sido_pages 실패 — 점수·표 시점이 어긋났을 수 있어 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 지역페이지"
          if ! python3 tools/make_indicator_pages.py; then
            rep "❌ 지표페이지 실패 — 커밋 안 함"
            echo "::error::make_indicator_pages 실패 — 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 지표페이지"
          # /cycle/ 리포트가 하드코딩해 둔 지수·전세가율 배열을 data.js에서 다시 만든다.
          # 손으로 두었더니 세 회차 연속 감사에 스테일로 걸렸다(2026-08-08).
          # 서술은 고정 문서라 이 스텝은 숫자 배열만 건드린다.
          if ! python3 tools/refresh_cycle_data.py; then
            rep "❌ 사이클 리포트 실패 — 커밋 안 함"
            echo "::error::refresh_cycle_data 실패 — 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 사이클 리포트"
          # 공유 카드(og:image)도 여기서 재생성한다 — 로컬 배치가 멈추면 /weekly/의
          # 카카오·트위터 미리보기가 옛 주차 지도에 고정된 채 '이번 주'로 배포된다.
          # ⚠️ 경고로만 넘기면 '조용히 안 만들어지는' 상태가 무한히 지속된다.
          # 도구가 없어서(인프라)와 실행이 깨져서(회귀)를 구분해 후자만 크게 남긴다.
          if python3 -c "import PIL" 2>/dev/null; then
            if python3 tools/make_weekly_share.py; then
              rep "✅ 공유카드"
            else
              rep "⚠️ 공유카드 실패 — /weekly/ og:image가 옛 주차에 고정된다"
              echo "::error::make_weekly_share 실패 — 공유 카드가 옛 주차에 고정된다"
            fi
          else
            rep "⚠️ 공유카드 건너뜀 — pillow 미설치(인프라)"
            echo "::warning::pillow 미설치로 공유 카드 생성을 건너뛴다(인프라 문제)"
          fi
          TARGETS="data.js data-core.js data-rest.json data-trend.json data-sgg.json data-size.json zone sitemap.xml jeonse-ratio moveins cycle share tools/data/.home_stamp"
          git add -A -- $TARGETS
          if git diff --cached --quiet; then
            rep "➖ 커밋 없음 — 원천이 그대로라 바뀐 파일이 없다(정상)"
            echo "변경 없음"
            exit 0
          fi
          NF=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git config user.name  "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "데이터 자동 갱신 (클라우드 冗長)"
          # 경합 대비 pull --rebase 후 push.
          # ⚠️ 예전엔 `-X theirs`로 충돌을 자동 해소했는데, data.js는 STATS가 **한 줄에
          #    170만 자**라 사람이 그 줄을 손대면 봇과 항상 같은 훅에서 부딪힌다. 그때
          #    -X theirs가 사람 수정을 경고 하나 없이 되돌렸다(2026-08-08 감사에서
          #    3-저장소로 재현: 손교정한 라벨이 exit 0인 채 옛 값으로 복귀).
          #    생성기가 다시 만드는 값은 다음 회차에 복구되지만, --heal-basic으로 넣은
          #    이력 교정처럼 갱신창 밖의 손교정은 영구 소실된다. 이제 충돌은 터뜨린다 —
          #    데이터는 다음 회차가 다시 만들지만 사람의 수정은 아무도 못 만든다.
          # ⚠️ 루프 마지막 명령이 sleep이면 3회 모두 실패해도 스텝이 exit 0으로 끝나
          # 커밋 유실이 초록 체크로 은폐된다(2026-08-04 감사). pushed 플래그로 판정한다.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "푸시 완료"; pushed=1
              rep "✅ 커밋·푸시 (${NF}개 파일)"
              # 색인 요청. PC 배치(run_weekly_update.bat)에만 있던 스텝이라
              # 클라우드 전환 뒤로는 어느 경로에서도 안 돌았다 — 그 사이 URL 집합이
              # 통째로 바뀌었는데(2026-08-06 생활권 31곳 → 시도 20곳) 제출이 없었다.
              if python3 tools/ping_indexnow.py --sitemap; then
                rep "✅ IndexNow 제출"
              else
                rep "⚠️ IndexNow 실패 — 색인 지연만 발생(데이터는 정상)"
                echo "::warning::IndexNow 핑 실패(색인 지연만 발생)"
              fi
              break
            fi
            # rebase가 중간 상태로 남으면 다음 회차도 연쇄 실패한다 — 정리 후 재시도.
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            rep "❌ 푸시 3회 실패 — 이 회차 커밋 유실. 충돌이면 사람이 같은 줄을 고친 것"
            echo "::error::push 3회 모두 실패 — 이 회차 커밋이 러너와 함께 유실된다."
            echo "::error::충돌이라면 사람이 같은 줄을 고쳤다는 뜻이다. 그 수정을 확인한 뒤 재실행할 것."
            exit 1
          fi

      # 성공·실패 무관하게 항목별 결과를 남긴다(2026-08-08 마케팅 세션 요청).
      # 실패만 알리면 '돌긴 돌았나'를 알 수 없다 — IndexNow가 클라우드 전환 뒤로
      # 아예 안 돌고 있었는데 아무도 몰랐던 게 그 예다. 조용한 정상과 조용한 정지가
      # 구별되지 않는 게 문제였다.
      - name: 결과 보고
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_WORKSPACE/_batch_report.txt"
          # 보고 파일이 없다 = 커밋 잡이 시작도 못 했다(체크아웃·아티팩트 단계에서 죽음).
          # 그것도 사실이므로 그대로 보고한다 — 침묵이 가장 나쁘다.
          [ -f "$R" ] || echo "❌ 배치가 보고 지점 전에 중단됨 — 러너 로그 확인 필요" > "$R"
          KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          TITLE="아공맵 배치 리포트"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### 아공맵 배치 $KST KST"
            echo ""
            sed 's/^/- /' "$R"
            echo ""
            echo "[실행 로그]($RUN)"
          } > _report.md
          cat _report.md >> "$GITHUB_STEP_SUMMARY"
          # 전용 이슈 하나에 코멘트를 쌓는다. 구독하면 알림이 오고 히스토리도 남는다.
          # 없으면 만든다 — 사람이 미리 만들어 둘 필요가 없어야 한다.
          N=$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ] || [ "$N" = "null" ]; then
            N=$(gh issue create --title "$TITLE" \
                  --body "매일 배치 결과가 코멘트로 쌓입니다. 이 이슈를 구독하면 알림을 받습니다. 닫아도 다음 회차에 새로 만들어집니다." \
                  --json number --jq .number 2>/dev/null || true)
          fi
          if [ -n "$N" ] && [ "$N" != "null" ]; then
            gh issue comment "$N" --body-file _report.md && echo "이슈 #$N 에 보고" || echo "::warning::이슈 코멘트 실패 — Step Summary에는 남았다"
          else
            echo "::warning::보고 이슈를 찾지도 만들지도 못했다 — Step Summary에는 남았다"
          fi

