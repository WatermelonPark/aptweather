name: 데이터 자동 갱신

# 집 PC 없이 완전 자동. KOSIS는 GitHub 러너의 Azure IP 일부를 간헐 차단해
# 단일 러너면 그날 전면 실패한다. 쿼리 크기 문제가 아니라 IP 룰렛이라 청크
# 쪼개기로는 못 푼다. 대신 병렬 3러너(=서로 다른 IP)를 띄워 오염 안 된 러너의
# 산출물만 커밋한다.
#
# ⚠️ 개별 러너 실패율은 시기에 따라 크게 출렁인다 — 2026-07 실측 ~12.5%였다가
# 2026-08-07~13 실측 38%(21러너 중 8 실패, 3러너 전멸 확률 ≈5.5%). 게다가 실패가
# 독립이 아니다: 같은 회차의 러너들이 같이 좋거나 같이 나빠(08-13 17시 3/3 vs
# 20시 1/3), KOSIS 부하(시간대)에 연동된 스로틀링으로 보인다. 그래서 러너를 더
# 늘리는 것보다 **시간을 바꿔 다시 던지는** retry 잡이 전멸의 주 방어선이다.
# 실패 형태도 거부가 아니라 무응답 hang이다(정상 응답 2~3초 vs 실패 15초 타임아웃
# 만료) — 같은 IP 재시도는 무의미하고, 프리플라이트 타임아웃을 늘려도 못 건진다.
on:
  schedule:
    # 시간대(2026-08-14 재배치): 저녁(20:00 KST)은 KOSIS 스로틀 피크와 겹치는
    # 정황이 있어(위 실측) 일일 런을 17:00 KST에 두기로 했다. 주간 발표(목)는 정오보다
    # 늦게 R-ONE에 반영되는 경우가 있어(2026-07-23 13시에도 미반영) 목요일은
    # 오전·오후에 이어 저녁 백스톱까지 3회 — 앞 런이 이미 반영분을 실었으면
    # 뒤 런은 '커밋 없음'으로 끝나 무해하다.
    #
    # ⚠️ 아래 cron은 '예약'이지 실제 시작이 아니다. 2026-08-27부터 GitHub 큐가 크게
    # 밀려 실측 지연이 +207~413분이다(2026-09-12 확인, 그 전 2주는 +29~71분). 예약대로
    # 17:00 KST에 걸어 두면 실제로는 20~22시에 돌아 그날 저녁 스로틀 피크와 다시
    # 겹쳤다. 그래서 2026-09-12에 세 예약을 모두 4시간 당겼다. 노리는 실제 시각은
    # 그대로 일일 17시, 목 11시·20시다.
    #
    # 지연은 best-effort라 우리가 없앨 수 없고 폭도 들쭉날쭉하다. 큐가 다시 비면
    # 예약 시각 가까이에 돌기 시작하는데, 그때는 일일 런이 13시에 도는 셈이라
    # 무해하지만(월간·KOSIS는 이미 나와 있다) 목 1차는 주간 발표 전인 07시가 되어
    # 헛돈다. 2·3차가 받쳐 주므로 데이터는 그대로 들어온다. 시각을 다시 손볼 땐
    # cron이 아니라 실측을 먼저 볼 것:
    #   gh run list --workflow=update-cloud.yml --limit 30 --json createdAt,event
    - cron: '0 4 * * *'    # 예약 13:00 KST (노리는 실제 17시) — 월간·KOSIS 셀프힐 (+ 목 주간 2차)
    - cron: '0 22 * * 3'   # 예약 목 07:00 KST (노리는 실제 11시) — 주간 발표 반영 1차 시도
    - cron: '0 7 * * 4'    # 예약 목 16:00 KST (노리는 실제 20시) — 주간 늦반영 백스톱
  workflow_dispatch:
    inputs:
      attempt:
        description: '재시도 카운터(자동 재트리거용, 사람은 기본값으로 둘 것)'
        type: string
        default: '1'
  # push 트리거는 두지 않는다. 워크플로를 한 줄만 고쳐도 3러너 40분 배치가 돌고,
  # 예정에 없던 시각에 데이터가 커밋된다(산출물 채택 로직 검증 때 임시로 썼고
  # 검증이 끝나 제거). 수동 확인이 필요하면 workflow_dispatch를 쓴다.

# 재시도가 생기면서 두 실행이 겹칠 수 있다(재시도 런이 도는 중에 정기 크론이
# 도착하는 등). 커밋 잡 둘이 같은 파일에 push 경쟁하지 않게 직렬화한다.
# cancel-in-progress는 끈다 — 도는 배치를 죽이면 그 회차 데이터가 유실된다.
concurrency:
  group: update-cloud
  cancel-in-progress: false

permissions:
  contents: write
  issues: write          # 매 회차 결과 보고를 전용 이슈에 코멘트로 남긴다(아래 '결과 보고')
  actions: write         # retry 잡이 자신을 workflow_dispatch로 재트리거한다

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 클라우드→한국 지연으로 배치가 ~40분. 여유 있게 60.
    strategy:
      fail-fast: false      # 한 러너가 나쁜 IP로 죽어도 나머지는 계속
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: IP 프리플라이트 (나쁜 IP는 이 러너 조용히 스킵)
        id: pre
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
        run: |
          # 나쁜 IP면 전체 배치가 KOSIS 호출마다 60s×3 재시도로 수십 분 hang한다.
          # 작은 KOSIS 호출 하나로 IP 건강성을 15초 내 판정. 나쁜 IP는 '실패'가 아니라
          # 'ok=false'로 표시해 이 러너만 조용히 스킵한다 — 다른 러너가 처리하므로
          # 잡을 red로 만들지 않는다(3러너 중 일부는 늘 나쁜 IP를 뽑는다).
          # 사유를 파일로 남긴다 — 0/3 전멸 시 커밋 잡이 '재시도로 나을 실패인가'를
          # 이걸로 가른다(아래 '재시도 판정' 참조). 각 스텝이 아는 것만 적는다.
          echo badip > "$GITHUB_WORKSPACE/_reason.txt"   # 잠정값. 아래에서 덮어쓴다.
          if [ -z "$KOSIS_API_KEY" ]; then echo nosecret > "$GITHUB_WORKSPACE/_reason.txt"; echo "ok=false" >> "$GITHUB_OUTPUT"; echo "KOSIS 시크릿 없음"; exit 0; fi
          if python - << 'PY'
          import os, sys, urllib.parse, urllib.request
          u='https://kosis.kr/openapi/Param/statisticsParameterData.do?'+urllib.parse.urlencode(
            dict(method='getList',apiKey=os.environ['KOSIS_API_KEY'],format='json',jsonVD='Y',
                 orgId='408',tblId='DT_304004_WEEK_001_B',objL1='ALL',itmId='ALL',prdSe='F',
                 startPrdDe='20260601',endPrdDe='20260620'))
          try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              urllib.request.urlopen(req,timeout=15).read()
          except Exception as e:
              print('나쁜 IP:',type(e).__name__); sys.exit(1)
          PY
          then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "프리플라이트 OK — 좋은 IP"
            echo pending > "$GITHUB_WORKSPACE/_reason.txt"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "이 러너 나쁜 IP — 배치 스킵(정상, 다른 러너가 처리)"
            echo badip > "$GITHUB_WORKSPACE/_reason.txt"
          fi

      - name: 데이터 갱신 시도 (러너 ${{ matrix.n }})
        id: upd
        if: steps.pre.outputs.ok == 'true'
        env:
          KOSIS_API_KEY:  ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
          ECOS_API_KEY:   ${{ secrets.ECOS_API_KEY || secrets.ECOS }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
          RONE_API_KEY:   ${{ secrets.RONE_API_KEY || secrets.RONE }}
          PYTHONUNBUFFERED: '1'   # 진행 로그 실시간 스트리밍(취소돼도 어디까지 갔는지 보이게)
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then
            echo nosecret > "$GITHUB_WORKSPACE/_reason.txt"
            echo "::warning::KOSIS 시크릿 없음 — 건너뜀"; exit 0
          fi
          set +e
          python tools/update_adv_data.py --update
          rc=$?
          set -e
          echo "batch rc=$rc"
          # 오염 판정: 프리플라이트가 KOSIS IP 건강성을 이미 보장하므로, 여기서는
          # 배치 exit 코드만 본다. rc!=0 = 크래시 또는 대량 실패(rc 3) = 폐기.
          # rc==0이면 커밋 — 비핵심 소스(ECOS·DATAGO)가 몇 개 실패해도 해당 값은
          # 직전 유지될 뿐이라 로컬 배치와 동일하게 부분 갱신을 커밋한다.
          if [ "$rc" -ne 0 ]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # rc=3은 '주요 지표가 하나도 안 살아 돌아왔다' = 원천 장애·스로틀이라
            # 시간이 지나면 낫는다. 그 외 비정상 종료는 코드가 깨진 것이라 35분
            # 뒤에도 똑같이 깨진다 — 재시도가 아니라 사람이 볼 일이다.
            if [ "$rc" -eq 3 ]; then echo source > "$GITHUB_WORKSPACE/_reason.txt"
            else echo crash > "$GITHUB_WORKSPACE/_reason.txt"; fi
            echo "배치 rc=$rc — 산출물 폐기(다음 회차 흡수)"
          else
            python tools/split_data.py
            echo ok > "$GITHUB_WORKSPACE/_reason.txt"
            echo "clean=true" >> "$GITHUB_OUTPUT"
            [ -s .fetch_failed ] && echo "참고: 비핵심 소스 실패 -> $(cat .fetch_failed) (직전 값 유지)"
            echo "clean 러너 — 산출물 업로드"
          fi

      # 사유는 **항상** 올린다. clean 산출물과 달리 실패한 러너의 것이 정보다.
      - name: 실패 사유 업로드 (전 러너)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reason-${{ matrix.n }}
          path: _reason.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: 산출물 업로드 (clean 러너만)
        if: steps.upd.outputs.clean == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: data-${{ matrix.n }}
          path: |
            data.js
            data-core.js
            data-rest.json
            data-trend.json
            data-sgg.json
            data-size.json
            .stats_changed
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true   # .stats_changed(변경 내역, 뉴스레터용) 포함

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    outputs:
      need_retry: ${{ steps.main.outputs.need_retry }}
    steps:
      - uses: actions/checkout@v5

      # ⚠️ pattern + merge-multiple:false 를 쓰지 않는다. v5 부터 **받은 결과가 1개일 때만**
      # 하위 디렉터리를 만들지 않고 path 에 곧장 푼다. 여러 개면 예전처럼 이름별로 나눈다.
      # 그래서 clean 러너가 1개인 날만 골라 깨지는 간헐 실패가 된다 — 2026-09-12 배치가
      # 그렇게 죽었고, 같은 실행 로그에 data-*(1개)는 평평, reason-*(3개)는 중첩으로
      # 갈린 것이 그대로 남아 있다. 격리 실험(_tmp-artifact-probe.yml)으로 재확인했다.
      #
      # 아래 코드는 `_art/data-*` 를 디렉터리로 훑는데, 평평하게 풀리면 data-core.js
      # 같은 **파일**이 글롭에 걸려 러너로 세어진다("러너 5/3 clean"). 개수도 경로도
      # 함께 틀어지므로 방어가 안 된다.
      #
      # name 을 지정하면 **항상** 단일 다운로드라 구조가 하나로 고정된다(path 에 곧장).
      # path 를 러너별로 나눠 주면 우리가 원하는 _art/data-N/ 이 그대로 나온다.
      # ⚠️ 아래 스텝 수는 fetch 잡의 matrix(n: [1,2,3])와 묶여 있다. 러너 수를 바꾸면
      #    여기도 함께 고칠 것. 묶인 대신 경로가 눈에 보여 조용히 어긋나지 않는다.
      - name: clean 산출물 내려받기 (러너 1)
        uses: actions/download-artifact@v7
        with: { name: data-1, path: _art/data-1 }
        continue-on-error: true    # 그 러너가 clean 이 아니면 아티팩트가 없다
      - name: clean 산출물 내려받기 (러너 2)
        uses: actions/download-artifact@v7
        with: { name: data-2, path: _art/data-2 }
        continue-on-error: true
      - name: clean 산출물 내려받기 (러너 3)
        uses: actions/download-artifact@v7
        with: { name: data-3, path: _art/data-3 }
        continue-on-error: true

      # 사유는 세 러너가 always() 로 올리므로 지금은 늘 3개지만, 러너가 통째로 죽으면
      # 1개가 되어 같은 함정에 빠진다. 여기도 이름을 지정해 구조를 고정한다.
      - name: 실패 사유 내려받기 (러너 1)
        uses: actions/download-artifact@v7
        with: { name: reason-1, path: _why/reason-1 }
        continue-on-error: true    # 없으면 아래에서 '모름'으로 처리(= 기존대로 재시도)
      - name: 실패 사유 내려받기 (러너 2)
        uses: actions/download-artifact@v7
        with: { name: reason-2, path: _why/reason-2 }
        continue-on-error: true
      - name: 실패 사유 내려받기 (러너 3)
        uses: actions/download-artifact@v7
        with: { name: reason-3, path: _why/reason-3 }
        continue-on-error: true

      # 빈 디렉터리가 남으면 위 글롭이 그것도 러너로 센다. 받지 못한 자리를 치운다.
      - name: 못 받은 자리 정리
        run: |
          for d in _art/data-* _why/reason-*; do
            [ -d "$d" ] || continue
            [ -z "$(ls -A "$d" 2>/dev/null)" ] && rmdir "$d" && echo "빈 디렉터리 제거: $d"
          done
          echo "clean 산출물: $(ls -d _art/data-* 2>/dev/null | wc -l)개"
          echo "실패 사유:    $(ls -d _why/reason-* 2>/dev/null | wc -l)개"

      - name: 변경 있으면 커밋·푸시
        id: main
        env:
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          # ── 항목별 결과 기록 ────────────────────────────────────────────
          # 이 잡은 중간에 `exit 1`로 끊기는 지점이 여럿이라, 결과를 마지막에
          # 몰아 쓰면 정작 실패한 회차의 보고가 안 나간다. 그래서 각 단계가
          # 지나갈 때마다 파일에 즉시 적고, 뒤의 `if: always()` 스텝이 그걸 읽어
          # 보고한다(2026-08-08 마케팅 세션 요청 — 성공일 때도 알림이 필요).
          R="$GITHUB_WORKSPACE/_batch_report.txt"
          : > "$R"
          rep() { echo "$1" >> "$R"; echo "REPORT $1"; }
          # ⚠️ clean 산출물이 서로 다를 수 있다 — weekly/monthly는 실패해도 rc=0
          # (직전 값 유지 후 부분 갱신)이라, R-ONE 타임아웃을 맞은 러너도 clean으로
          # 올라온다. 예전엔 head -1로 아무거나 골라서, 7/27을 받아온 러너 2·3을
          # 두고 타임아웃 난 러너 1(7/20)을 채택해 한 주 묵은 데이터를 커밋했다
          # (2026-07-30 실사고). 그래서 '가장 최신 주간/월간을 가진 산출물'을 고른다.
          # 산출물별 최신 weekly(YYYY-MM-DD)를 뽑아 가장 신선한 것을 고른다.
          # 파이썬 heredoc은 YAML 블록 들여쓰기를 깨므로 순수 셸로 짠다.
          SRC=""; BEST=""; BESTMO=""; BESTSL=""
          for d in _art/data-*; do
            [ -f "$d/data-core.js" ] || continue
            wk=$(grep -oE '"p":"[0-9]{4}-[0-9]{2}-[0-9]{2}"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
            # 월간도 같은 아티팩트에서 읽는다 — 2026-08-06부터 ADV.monthly가
            # data-core.js에 실린다(홈 통합표가 그린다). 주간이 동률일 때 월간만
            # 뒤처진 러너가 채택되던 구멍을 막는 2차 정렬 키다.
            mo=$(grep -oE '"p":"[0-9]{4}-[0-9]{2}"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}-[0-9]{2}' | sort | tail -1)
            # 3차 키: 공급 축(ADV.sido.L = 준공 실적 마지막 완결 분기). 주간·월간이
            # 동률이면 공급이 뒤진 러너가 그대로 이겨, 새 분기 준공·착공을 그 회차에
            # 못 실었다(2026-08-08 감사에서 합성 아티팩트로 재현).
            sl=$(grep -oE '"L":"[0-9]{4}Q[1-4]"' "$d/data-core.js" \
                 | grep -oE '[0-9]{4}Q[1-4]' | sort | tail -1)
            echo "후보 $d: weekly=${wk:--} monthly=${mo:--} sidoL=${sl:--}"
            newer=0
            if [ -n "$wk" ]; then
              if [ -z "$BEST" ] || [ "$wk" \> "$BEST" ]; then newer=1
              elif [ "$wk" = "$BEST" ] && [ -n "$mo" ] && [ "$mo" \> "$BESTMO" ]; then newer=1
              elif [ "$wk" = "$BEST" ] && [ "$mo" = "$BESTMO" ] && [ -n "$sl" ] && [ "$sl" \> "$BESTSL" ]; then newer=1
              fi
            fi
            if [ "$newer" = "1" ]; then BEST="$wk"; BESTMO="$mo"; BESTSL="$sl"; SRC="$d"; fi
          done
          # weekly를 하나도 못 읽었으면(구조 변경 등) 예전처럼 아무거나
          [ -z "$SRC" ] && SRC=$(ls -d _art/data-* 2>/dev/null | head -1 || true)
          NRUN=$(ls -d _art/data-* 2>/dev/null | wc -l | tr -d ' ')
          if [ -z "$SRC" ]; then
            # ── 재시도 판정(2026-08-15) ─────────────────────────────────────
            # 전멸이라고 다 같은 전멸이 아니다. 재시도는 '시간과 IP를 바꾸면
            # 결과가 달라질 수 있다'는 가정 위에 서 있는데, 그 가정이 틀린 실패가
            # 있다 — 시크릿 만료(nosecret)와 코드 크래시(crash)는 35분 뒤에도
            # 똑같이 실패한다. 그때 3회를 도는 건 105분을 태우고 경보를 그만큼
            # 늦추는 것뿐이다. 감시 쪽에서 결정론적 실패를 즉시 red로 보내는 것과
            # 같은 원칙이다(check_freshness의 rc=2 / alert 잡).
            #   badip·source → 시간이 바꾼다 → 재시도
            #   nosecret·crash → 사람이 고쳐야 한다 → 즉시 red
            # ⚠️ 사유를 못 읽으면(아티팩트 누락 등) **재시도 쪽**으로 둔다. 새 판정
            # 장치가 고장났을 때 조용히 재시도를 꺼버리면, 고칠 수 있었던 회차까지
            # 같이 죽는다. 모르면 예전처럼 행동한다.
            WHY=$(cat _why/reason-*/_reason.txt 2>/dev/null | tr -d '\r' | xargs || true)
            [ -z "$WHY" ] && WHY="(사유 못읽음)"
            echo "러너 사유: $WHY"
            HEALABLE=0
            for w in $WHY; do
              case "$w" in
                nosecret|crash) ;;
                *) HEALABLE=1 ;;
              esac
            done
            if [ "$HEALABLE" = "0" ]; then
              rep "❌ 러너 0/3 clean — 재시도로 낫지 않는 실패($WHY)"
              rep "  → 시크릿 만료 또는 코드 이상. 재시도하지 않고 즉시 알린다."
              echo "::error::0/3 전멸 사유가 결정론적($WHY) — 재시도 생략, 사람이 확인할 것"
              exit 1
            fi
            # 전멸 = KOSIS 스로틀이 이 시간대를 조이고 있다는 뜻일 가능성이 크다.
            # retry 잡이 35분 뒤 새 런(새 IP + 다른 시각)으로 재도전한다(최대 3시도).
            if [ "${ATTEMPT:-1}" -lt 3 ]; then
              rep "❌ 러너 0/3 clean (시도 ${ATTEMPT:-1}/3) — 35분 뒤 자동 재시도"
              # 이 한 줄이 재시도의 유일한 스위치다. 조용히 실패하면 전멸한 회차가
              # 재시도 없이 끝나는데, 로그에는 '재시도한다'고만 남아 아무도 모른다.
              if ! echo "need_retry=true" >> "$GITHUB_OUTPUT"; then
                echo "::error::need_retry 출력에 실패 — 자동 재시도가 걸리지 않는다"
                exit 1
              fi
              # ⚠️ 여기서는 red로 만들지 않는다. retry 잡의 `if`가 커스텀 조건이라,
              # 커밋 잡이 실패하면 GitHub이 그 잡을 **건너뛴다** — 재시도를 걸어놓고
              # 재시도를 못 돌게 하는 꼴이다. 판정은 재시도가 소진된 뒤에 한다.
              exit 0
            else
              rep "❌ 러너 0/3 clean (시도 3/3 소진) — 이번 회차 갱신 없음"
              # 105분에 걸쳐 3회를 다 쓰고도 한 러너도 못 건진 회차다. 예전엔 여기서
              # exit 0이라 워크플로가 초록으로 끝났고, 이슈 코멘트의 ❌만 남아
              # **실패 메일이 오지 않았다**. 감시(예약 18:07, 노리는 실제 22시)가 뒤처짐으로 잡아주긴 하나
              # 17시 회차면 5시간을 모른 채 지나간다 — 그만큼 늦게 아는 것이다.
              echo "::error::재시도 3회 전멸 — 원천 광역 장애 가능성. 다음 크론이 흡수하지만 사람이 확인할 것"
              exit 1
            fi
          fi
          rep "✅ 러너 ${NRUN}/3 clean · 채택 주간 ${BEST:--} / 월간 ${BESTMO:--} / 공급 ${BESTSL:--}"
          # 비교 축은 주간(1순위) + 월간(동률일 때 2순위)이다. 2026-08-06 이후
          # data-core.js에 ADV.monthly가 실려 같은 아티팩트에서 둘 다 읽는다 —
          # 그 전에는 월간 축이 없어 '주간 동률이면 앞 후보 유지'였다(2026-08-07 정정).
          echo "채택: $SRC (주간 $BEST · 월간 ${BESTMO:--})"
          # split_data.py가 내는 5파일을 모두 옮긴다. data-sgg/data-size가 빠지면
          # checkout된 옛 파일이 그대로 남아 '지연 로드만 몇 주 묵는' 부분배포가 된다
          # (2026-08-04 감사: 두 파일은 어떤 목록에도 없어 사람이 손으로만 커밋돼 왔다).
          # ⚠️ 기본 셸이 bash -e라, 여기서 죽으면 ❌ 기록 없이 스텝이 즉사하고
          # always() 보고가 앞선 ✅ 줄만 담아 '전부 성공' 코멘트를 보낸다(2026-08-10
          # 리뷰). 실패를 리포트에 남기고 죽는다.
          if ! cp "$SRC/data.js" "$SRC/data-core.js" "$SRC/data-rest.json" "$SRC/data-trend.json" .; then
            rep "❌ 산출물 복사 실패 — 아티팩트가 불완전하다(러너 $SRC)"
            exit 1
          fi
          for f in data-sgg.json data-size.json; do
            [ -f "$SRC/$f" ] && cp "$SRC/$f" . || echo "::warning::$f 산출물 없음(구 러너?) — 기존 파일 유지"
          done
          # 정적 페이지(zone·지표)는 data.js를 구워 만들므로 새 데이터로 재생성해
          # 함께 커밋한다. 로컬 스케줄러가 꺼진 PC-less 체제에선 여기가 유일한
          # 재생성 지점. 생성기는 stdlib만 쓰고(러너 기본 python3), 날짜를 데이터
          # 시점에서 유도하므로 데이터가 같으면 diff도 없다. 실패해도 데이터
          # 커밋은 막지 않는다(::warning만, 다음 회차 재시도).
          # ── 검증 게이트 ────────────────────────────────────────────────
          # PC-less 체제에선 이 워크플로가 유일한 배포 경로다. 예전엔 여기에 검증이
          # 전혀 없어서, 한쪽 구현만 고친 커밋이 들어와도 옛 산식으로 존 페이지를
          # 구워 그대로 배포했다(홈 순위표와 /zone/ 상세가 다른 숫자를 표시).
          # 그래서 생성 '전에' 두 가지를 막는다:
          #   1) pytest — 코드가 깨진 채로 페이지를 굽지 않는다
          # (2026-08-06: 옛 게이트 2번 check_dual_calc는 폐지. 점수를 sido_zones.py가
          #  빌드 시점에 계산해 ADV.sido로 싣고 홈·지역 페이지가 읽기만 하므로
          #  갈릴 구현 자체가 없다.)
          # 실패하면 아무것도 커밋하지 않고 잡을 red로 만든다.
          # (데이터 갱신은 하루 밀리지만, 틀린 숫자가 조용히 나가는 것보다 낫다.
          #  실패는 GitHub 알림으로 사람에게 전달된다.)
          # ⚠️ '테스트가 실패했다'와 '테스트를 돌릴 수 없었다'를 반드시 구분한다.
          # 둘을 뭉뚱그리면 pip 일시 장애 같은 인프라 문제가 매일의 데이터 갱신을
          # 영구히 막는다(게이트가 오히려 사고가 된다). 도구가 없으면 경고만 남기고
          # 넘어가되, 도구가 있는데 테스트가 깨지면 배포를 멈춘다.
          # pillow는 공유 카드(make_weekly_share)가 쓴다. 여기서 함께 깔지 않으면
          # 그 스텝이 매 회차 ModuleNotFoundError로 죽는데 `|| echo ::warning`이라
          # 배치는 green으로 끝난다 — 2026-08-04 이 스텝을 넣은 뒤 4회 연속 실패했고
          # /weekly/의 og:image가 2026-07-18 지도에 3주간 고정돼 있었다.
          python3 -m pip install --quiet pytest pillow || true
          if python3 -c "import pytest" 2>/dev/null; then
            if ! python3 -m pytest tools/tests/ -q; then
              rep "❌ 테스트 실패 — 배포 중단(코드 회귀). 데이터 커밋 안 함"
              echo "::error::pytest 실패 — 배포 중단(코드 회귀). 데이터는 커밋하지 않는다."
              exit 1
            fi
            rep "✅ 테스트"
          else
            rep "⚠️ 테스트 건너뜀 — pytest 설치 실패(인프라)"
            echo "::warning::pytest를 설치하지 못해 테스트를 건너뛴다(인프라 문제)."
          fi
          echo "검증 통과 — 페이지 생성으로 진행"
          # ───────────────────────────────────────────────────────────────
          # ⚠️ 경고로 넘기지 않는다. make_sido_pages는 '점수와 표의 시점이 어긋났다'는
          # 게이트를 들고 있는데, 실패를 흡수하면 그 게이트가 막으려던 데이터(data.js·
          # zone·sitemap)를 그대로 커밋해 버린다 — 로컬 배치(run_weekly_update.bat)는
          # 같은 실패에 전량 중단이라 두 배치의 안전 동작이 정반대였다(2026-08-07 감사).
          if ! python3 tools/make_sido_pages.py; then
            rep "❌ 지역페이지 실패 — 점수·표 시점 불일치 의심. 커밋 안 함"
            echo "::error::make_sido_pages 실패 — 점수·표 시점이 어긋났을 수 있어 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 지역페이지"
          if ! python3 tools/make_indicator_pages.py; then
            rep "❌ 지표페이지 실패 — 커밋 안 함"
            echo "::error::make_indicator_pages 실패 — 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 지표페이지"
          # /monthly/ — 매달 공개 통계를 순서대로 훑는 화면. 지표 페이지와 같은
          # data.js를 읽으므로 그 뒤에 둔다. 실패하면 커밋하지 않는다 — 이 화면은
          # 블로그 랜딩이라 반쯤 갱신된 표가 나가면 그 달 글이 통째로 어긋난다.
          if ! python3 tools/make_monthly_page.py; then
            rep "❌ 이달의 통계 실패 — 커밋 안 함"
            echo "::error::make_monthly_page 실패 — 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 이달의 통계"
          # /cycle/ 리포트가 하드코딩해 둔 지수·전세가율 배열을 data.js에서 다시 만든다.
          # 손으로 두었더니 세 회차 연속 감사에 스테일로 걸렸다(2026-08-08).
          # 서술은 고정 문서라 이 스텝은 숫자 배열만 건드린다.
          if ! python3 tools/refresh_cycle_data.py; then
            rep "❌ 사이클 리포트 실패 — 커밋 안 함"
            echo "::error::refresh_cycle_data 실패 — 커밋하지 않는다"
            exit 1
          fi
          rep "✅ 사이클 리포트"
          # 공유 카드(og:image)도 여기서 재생성한다 — 로컬 배치가 멈추면 /weekly/의
          # 카카오·트위터 미리보기가 옛 주차 지도에 고정된 채 '이번 주'로 배포된다.
          # ⚠️ 경고로만 넘기면 '조용히 안 만들어지는' 상태가 무한히 지속된다.
          # 도구가 없어서(인프라)와 실행이 깨져서(회귀)를 구분해 후자만 크게 남긴다.
          if python3 -c "import PIL" 2>/dev/null; then
            if python3 tools/make_weekly_share.py; then
              rep "✅ 공유카드"
            else
              rep "⚠️ 공유카드 실패 — /weekly/ og:image가 옛 주차에 고정된다"
              echo "::error::make_weekly_share 실패 — 공유 카드가 옛 주차에 고정된다"
            fi
          else
            rep "⚠️ 공유카드 건너뜀 — pillow 미설치(인프라)"
            echo "::warning::pillow 미설치로 공유 카드 생성을 건너뛴다(인프라 문제)"
          fi
          TARGETS="data.js data-core.js data-rest.json data-trend.json data-sgg.json data-size.json zone sitemap.xml jeonse-ratio moveins monthly cycle share tools/data/.home_stamp"
          git add -A -- $TARGETS || { rep "❌ git add 실패 — TARGETS 경로 확인"; exit 1; }
          if git diff --cached --quiet; then
            rep "➖ 커밋 없음 — 원천이 그대로라 바뀐 파일이 없다(정상)"
            echo "변경 없음"
            exit 0
          fi
          NF=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git config user.name  "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "데이터 자동 갱신" || { rep "❌ git commit 실패"; exit 1; }
          # 경합 대비 pull --rebase 후 push.
          # ⚠️ 예전엔 `-X theirs`로 충돌을 자동 해소했는데, data.js는 STATS가 **한 줄에
          #    170만 자**라 사람이 그 줄을 손대면 봇과 항상 같은 훅에서 부딪힌다. 그때
          #    -X theirs가 사람 수정을 경고 하나 없이 되돌렸다(2026-08-08 감사에서
          #    3-저장소로 재현: 손교정한 라벨이 exit 0인 채 옛 값으로 복귀).
          #    생성기가 다시 만드는 값은 다음 회차에 복구되지만, --heal-basic으로 넣은
          #    이력 교정처럼 갱신창 밖의 손교정은 영구 소실된다. 이제 충돌은 터뜨린다 —
          #    데이터는 다음 회차가 다시 만들지만 사람의 수정은 아무도 못 만든다.
          # ⚠️ 루프 마지막 명령이 sleep이면 3회 모두 실패해도 스텝이 exit 0으로 끝나
          # 커밋 유실이 초록 체크로 은폐된다(2026-08-04 감사). pushed 플래그로 판정한다.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "푸시 완료"; pushed=1
              rep "✅ 커밋·푸시 (${NF}개 파일)"
              # 색인 요청. PC 배치(run_weekly_update.bat)에만 있던 스텝이라
              # 클라우드 전환 뒤로는 어느 경로에서도 안 돌았다 — 그 사이 URL 집합이
              # 통째로 바뀌었는데(2026-08-06 생활권 31곳 → 시도 20곳) 제출이 없었다.
              if python3 tools/ping_indexnow.py --sitemap; then
                rep "✅ IndexNow 제출"
              else
                rep "⚠️ IndexNow 실패 — 색인 지연만 발생(데이터는 정상)"
                echo "::warning::IndexNow 핑 실패(색인 지연만 발생)"
              fi
              break
            fi
            # rebase가 중간 상태로 남으면 다음 회차도 연쇄 실패한다 — 정리 후 재시도.
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            rep "❌ 푸시 3회 실패 — 이 회차 커밋 유실. 충돌이면 사람이 같은 줄을 고친 것"
            echo "::error::push 3회 모두 실패 — 이 회차 커밋이 러너와 함께 유실된다."
            echo "::error::충돌이라면 사람이 같은 줄을 고쳤다는 뜻이다. 그 수정을 확인한 뒤 재실행할 것."
            exit 1
          fi

      # 성공·실패 무관하게 항목별 결과를 남긴다(2026-08-08 마케팅 세션 요청).
      # 실패만 알리면 '돌긴 돌았나'를 알 수 없다 — IndexNow가 클라우드 전환 뒤로
      # 아예 안 돌고 있었는데 아무도 몰랐던 게 그 예다. 조용한 정상과 조용한 정지가
      # 구별되지 않는 게 문제였다.
      - name: 결과 보고
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_WORKSPACE/_batch_report.txt"
          # 보고 파일이 없다 = 커밋 잡이 시작도 못 했다(체크아웃·아티팩트 단계에서 죽음).
          # 그것도 사실이므로 그대로 보고한다 — 침묵이 가장 나쁘다.
          [ -f "$R" ] || echo "❌ 배치가 보고 지점 전에 중단됨 — 러너 로그 확인 필요" > "$R"

          # ── 감시가 살아 있는지 되짚는다(2026-09-09) ──────────────────────
          # ⚠️ rep()는 앞 커밋 스텝의 지역 함수다. 셸 함수는 스텝을 넘지 않으므로
          # 여기서는 $R에 직접 덧붙인다(rep을 쓰면 command not found로 죽는다).
          # 감시(watchdog)는 **실패할 때만** 메일을 보낸다. 그래서 회차가 아예
          # 안 뜬 날은 아무 신호도 없다 — 2026-08-13과 09-01에 실제로 그랬고,
          # 크론을 옮긴 뒤에도 재발했다. 감시가 감시받지 않는 유일한 구멍이라
          # 배치가 대신 확인한다(둘은 서로 다른 워크플로라 함께 죽지 않는다).
          # 30시간: 감시는 하루 한 번인데 GitHub 크론이 상시 3~6시간 밀리므로
          # (실측 8/28~9/9 +169~592분) 24시간으로 자르면 매일 오탐이 난다.
          LAST=$(gh run list --workflow=watchdog.yml --limit 1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "⚠️ 감시 실행 이력을 읽지 못했다 — 감시가 도는지 확인 필요" >> "$R"
          else
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
            LKST=$(TZ=Asia/Seoul date -d "$LAST" '+%m-%d %H:%M')
            if [ "$AGE" -gt 30 ]; then
              echo "⚠️ 감시가 ${AGE}시간째 안 돌았다(마지막 $LKST KST) — 크론 누락 의심" >> "$R"
            else
              echo "✅ 감시 최근 실행 $LKST KST (${AGE}시간 전)" >> "$R"
            fi
          fi
          KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          TITLE="아공맵 배치 리포트"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # ⚠️ @멘션은 사실상 **메일 발송 스위치**다. 이슈 코멘트 알림은 구독자에게만
          # 가지만 멘션은 구독과 무관하게 메일이 간다(2026-08-08 사용자 확인).
          # 그래서 예전엔 '매일 온다'를 보장하려고 항상 붙였는데, 그러면 정상 회차에도
          # 매일 메일이 가고 곧 안 읽히게 된다 — 진짜 경보가 그 속에 묻힌다.
          # watchdog.yml이 "오경보가 쌓이면 진짜 경보도 같이 묻힌다"고 이미 적어 두고도
          # 정상 알림에는 그 원칙이 빠져 있었다(2026-09-12 대표 지적으로 발견).
          # 지금은 실패·점검이상·월요일에만 붙인다. 침묵이 곧 정상이라는 뜻이 되게 한다.
          #
          # 멘션을 떼도 조용한 정지는 안 생긴다 — 배치와 점검이 서로를 본다:
          #   배치 실패      → 배치가 멘션
          #   배치는 성공인데 데이터가 안 나감 / 배치가 아예 안 뜸 → 점검이 뒤처짐으로 잡음
          #   점검이 안 뜸   → 배치가 위의 30시간 규칙으로 잡아 멘션
          OWNER="${{ github.repository_owner }}"
          WD=$(( $(TZ=Asia/Seoul date '+%u') - 1 ))   # 0=월 … 6=일
          # 본문 조립은 tools/format_batch_report.py 가 한다(시험이 붙어 있는 자리).
          # ⚠️ 그게 죽어도 알림 자체는 나가야 한다 — 침묵이 가장 나쁘다. 폴백은 옛 형식
          #    그대로 두되 멘션을 붙여 사람이 이상을 알아채게 한다.
          if ! python3 tools/format_batch_report.py "$R" --kst "$KST"                  --run-url "$RUN" --owner "$OWNER" --weekday "$WD" > _report.md; then
            echo "::warning::알림 본문 생성 실패 — 옛 형식으로 보낸다"
            {
              echo "### 아공맵 배치 $KST KST"
              echo ""
              echo "(알림 본문 생성이 실패해 원본 기록을 그대로 싣습니다)"
              echo ""
              sed 's/^/- /' "$R"
              echo ""
              echo "[실행 로그]($RUN) · @$OWNER"
            } > _report.md
          fi
          # 화면 요약에는 사람용 본문 **과** 단계별 원본을 함께 남긴다. 메일에서 덜어낸
          # 상세가 통째로 사라지면 세션이 파고들 입구가 없어진다.
          {
            cat _report.md
            echo ""
            echo "<details><summary>단계별 기록(원본)</summary>"
            echo ""
            sed 's/^/- /' "$R"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # 전용 이슈 하나에 코멘트를 쌓는다. 구독하면 알림이 오고 히스토리도 남는다.
          # 없으면 만든다 — 사람이 미리 만들어 둘 필요가 없어야 한다.
          N=$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ] || [ "$N" = "null" ]; then
            # 담당자로 지정해 두면 그 이슈에 자동 구독된다 — 멘션과 겹치는 안전장치다.
            # `gh issue create`는 --json 미지원(unknown flag). 첫 실전(2026-08-08 20:33)에서
            # 그 플래그로 죽었는데 2>/dev/null이 에러를 삼켜 경고 한 줄만 남았다.
            # 생성 출력은 이슈 URL — 끝의 숫자를 잘라 쓰고, 에러는 더 이상 숨기지 않는다.
            URL=$(gh issue create --title "$TITLE" --assignee "$OWNER" \
                  --body "매일 배치 결과가 코멘트로 쌓입니다. 이 이슈를 구독하면 알림을 받습니다. 닫아도 다음 회차에 새로 만들어집니다." \
                  || true)
            N=$(echo "$URL" | grep -oE '[0-9]+$' || true)
          fi
          if [ -n "$N" ] && [ "$N" != "null" ]; then
            gh issue comment "$N" --body-file _report.md && echo "이슈 #$N 에 보고" || echo "::warning::이슈 코멘트 실패 — Step Summary에는 남았다"
          else
            echo "::warning::보고 이슈를 찾지도 만들지도 못했다 — Step Summary에는 남았다"
          fi

  # 3러너 전멸(0/3 clean) 시 자기 재트리거. 러너 추가가 아니라 '시간을 바꿔
  # 다시 던지기'인 이유: 실패가 러너 간 독립이 아니라 시간대에 상관돼 있어서다
  # (파일 머리 주석의 실측). 35분이면 IP도 스로틀 창도 새로 뽑는다.
  # 무한루프 방지 2중: ①attempt 카운터(최대 3시도) — 여기서 걸러도, commit 잡이
  # 시도 3/3이면 need_retry 자체를 안 세운다 ②workflow_dispatch는 GITHUB_TOKEN
  # 재귀 차단의 예외라 동작하는 대신, 그만큼 카운터가 유일한 제동이다.
  #
  # ⚠️ 35분 대기는 이 워크플로 **밖**(update-cloud-retry.yml)에서 한다.
  # 여기서 자면 파일 머리의 `concurrency: update-cloud`가 그 35분 내내 잡혀 있고,
  # 그 창에 도착한 크론은 pending으로 밀린다. pending은 그룹당 하나만 남으므로
  # **뒤이어 도착한 재시도 디스패치가 앞서 대기 중이던 크론을 취소한다** —
  # 하필 목 20:00 백스톱이 그 자리다. 파이프라인이 실패 중인 날에만, 즉 백스톱이
  # 가장 필요한 날에만 백스톱이 사라진다(2026-08-15 리뷰). 그래서 대기는 자체
  # concurrency 그룹을 가진 별도 워크플로로 내보내고 여기서는 즉시 넘긴다.
  retry:
    needs: commit
    if: needs.commit.outputs.need_retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 대기 워크플로에 넘김(이 런은 즉시 끝나 그룹을 놓아준다)
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          NEXT=$((ATTEMPT + 1))
          if [ "$NEXT" -gt 3 ]; then
            echo "시도 한도 도달 — 재트리거하지 않음(방어선, 정상이라면 commit 잡이 이미 걸렀다)"
            exit 0
          fi
          echo "시도 ${ATTEMPT} 전멸 — 대기 워크플로에 시도 ${NEXT} 예약"
          if ! gh workflow run update-cloud-retry.yml --ref main \
                 -f attempt="$NEXT" -R "$GITHUB_REPOSITORY"; then
            echo "::error::재시도 예약 실패 — 이번 회차는 다음 크론이 흡수한다(attempt=$NEXT)"
            exit 1
          fi
          echo "예약 완료(attempt=$NEXT)"

