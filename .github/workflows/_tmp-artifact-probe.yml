# 임시 실험용. 백로그 7번(download-artifact 상향)이 끝나면 이 파일은 지운다.
#
# 왜 만들었나. 2026-09-12 에 download-artifact 를 v4→v7 로 올렸다가 배치를 깼다.
# 릴리스 노트만 읽고 "v5 의 파괴 변경은 artifact-ids 전용"이라고 판단한 것이 원인이라,
# 같은 실수를 반복하지 않으려면 **실제로 돌려 보고** 고쳐야 한다. 실 배치에서 실험하면
# 또 데이터 갱신이 멈추므로 여기서 격리해 본다.
#
# 확인할 것: clean 러너가 **1개뿐일 때** 세 방법이 각각 어떤 경로에 푸는가.
#   A) pattern + merge-multiple:false  ← 지금 배치가 쓰는 방식(v4 에서는 중첩이었다)
#   B) name 지정                        ← 단일 다운로드로 고정
#   C) gh run download                  ← 액션을 아예 안 쓴다(Node 경고에서 자유)
name: 임시 실험 — 아티팩트 다운로드 경로

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      # 일부러 **하나만** 올린다. 3개일 때는 v7 도 중첩으로 풀어서 문제가 안 보인다.
      - run: mkdir -p out && echo one > out/data.js && echo core > out/data-core.js
      - uses: actions/upload-artifact@v6
        with:
          name: data-1
          path: out/*

  down:
    needs: up
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A. pattern + merge-multiple false
        uses: actions/download-artifact@v7
        with:
          path: _a
          pattern: data-*
          merge-multiple: false
        continue-on-error: true

      - name: B. name 지정
        uses: actions/download-artifact@v7
        with:
          name: data-1
          path: _b/data-1
        continue-on-error: true

      - name: C. gh run download (진행 중인 실행의 아티팩트를 받을 수 있나)
        continue-on-error: true
        run: |
          gh run download "$GITHUB_RUN_ID" -n data-1 -D _c/data-1 \
            && echo "C: 성공" || echo "C: 실패(진행 중 실행은 못 받는 듯)"

      - name: 결과 — 어느 경로에 풀렸나
        run: |
          echo "── 파일 목록 ──"
          find _a _b _c -type f 2>/dev/null | sort || true
          echo "── 판정 ──"
          for m in a b c; do
            if ls -d _$m/data-* >/dev/null 2>&1; then
              echo "$m: 중첩(_$m/data-N/) — 지금 배치 코드가 기대하는 구조"
            elif [ -f _$m/data.js ]; then
              echo "$m: 평평(_$m/) — 배치 코드가 깨지는 구조"
            else
              echo "$m: 받지 못함"
            fi
          done
