name: update-hub

# Task 8: 건축HUB(HsPmsHubService) 월간 인허가/착공 실측 갱신.
#
# CLOUD-VIABLE (Task 2 hub-probe.yml 실측): 건축HUB가 GitHub Actions 러너
# (Azure IP)를 차단하지 않음을 확인했다 — 오산 세교동 표본 호출에서 <item>
# 정상 수신. 그래서 이 워크플로는 그 결과를 실제 운영에 배선한다.
#
# 이 워크플로가 하는 일은 딱 하나: tools/data/hub_permits.json 갱신·커밋.
# data.js/data-core.js/data-rest.json 재계산(hub_derive 포함)은 여기서
# 하지 않는다 — 기존 daily update-cloud.yml(update_adv_data.py --update)이
# 이미 hub_derive를 통해 hub_permits.json을 읽어 매일 data.js에 접어 넣고
# 있으므로, 여기서 또 data.js를 만들면 같은 파일을 두 워크플로가 따로
# 커밋하는 경합이 생긴다. hub_permits.json만 갱신해두면 다음 daily 런이
# 자동으로 흡수한다(최대 하루 지연, 월간 갱신이라 무해).
#
# 쿼터 주의: --full(전량 첫 시딩)은 대상 시군구·법정동을 순차 페이싱(2.5초/호출)
# 호출하는 방식이라 약 12,000회 호출 · 11~14시간이 걸린다. DATA_GO_KR_KEY에
# 일일 호출 한도가 있으면 하루 안에 못 끝내고 일부만 수집된 채 끝날 수 있다.
# 이 경우에도 collector(tools/fetch_hub_permits.py)의 에러 분류
# (429/한도초과는 재시도하지 않고 unresolved로 기록) + productive_bjdong
# 스캔 캐시 덕에 다음 실행이 이어받아 자가 치유한다 — 기존 데이터를 덮어
# 지우지 않는다. 전량 첫 시딩은 이 워크플로를 만들 때 자동 실행되지 않으며,
# 사람이 workflow_dispatch에서 mode=full로 명시적으로 트리거해야 한다.
#
# GitHub 러너 6시간 캡과 RESUMABLE --full (Fix pass): 전량 첫 시딩(~11~14시간)은
# GitHub 호스티드 러너의 6시간/잡 하드 캡(360분)을 넘는다 — timeout-minutes: 350은
# 그 캡 아래 값일 뿐, 실행 자체가 그 시간 안에 못 끝나면 잡이 도중에 KILL된다.
# 그래서 mode=full은 RESUMABLE하게 만들어뒀다: fetch_hub_permits.py --full은
# 그룹을 하나 끝낼 때마다 meta['scanned']에 기록하며 즉시 저장하고, 다음 --full
# 실행은 이미 meta['scanned']에 있는 그룹을 건너뛰고 이어서 스캔한다. 즉 킬된
# 잡을 그대로 mode=full로 재트리거하면(사람이 수동으로, 약 2~3회) 이전 회차가
# 남긴 지점부터 이어져 결국 ~12,000회 호출이 전부 끝난다. 자동 재트리거 루프는
# 의도적으로 넣지 않았다 — 사람이 진행 상황(로그/커밋된 hub_permits.json의
# meta.scanned 길이)을 보고 다시 트리거한다. 처음부터 완전히 다시 돌리려면(연 1회
# 재구축 등) collector를 --full --reseed로 로컬/별도 실행해야 한다(이 워크플로의
# workflow_dispatch에는 reseed 옵션을 노출하지 않음 — 실수로 전량 재시딩을 막기 위해).
# 증분 6샤드 병렬 (2026-08-02): 증분은 --full과 달리 meta['scanned']를 건너뛰지
# 않아 매번 생산적 법정동 2,646곳을 처음부터 전부 훑는다. 원천이 불안정한 날엔
# 재시도가 붙어 340분을 넘긴다 — 8/2 실사고로 5시간 40분 돌다 서울 강동구에서
# 타임아웃, 148곳 중 33곳만 갱신됐다. 그냥 재실행하면 항상 같은 순서로 처음부터
# 도니 서울만 반복 갱신되고 나머지는 영영 안 돈다. 그래서 잡을 6샤드로 쪼갠다:
# 샤드당 법정동 367~547곳(최악 1시간 남짓)이라 캡에 여유가 크고, 샤드마다 러너가
# 달라 IP도 갈린다. 산출물은 artifact로 올려 merge 잡이 한 번만 커밋한다
# (샤드가 각자 커밋하면 같은 파일에 6-way 경합). 소유권 규칙은
# fetch_hub_permits.shard_keys()가 단일 출처고 merge_hub_shards.py가 재사용한다.
on:
  schedule:
    - cron: '0 18 1 * *'   # 매월 2일 03:00 KST(=1일 18:00 UTC) — 증분 갱신.
                           # cron은 UTC라 KST 환산에서 날짜가 하루 넘어간다.
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드 (full=준공 전량 시딩 · reseed=전량 재시딩(6샤드, 라이브 무중단) · demol=멸실 전량 시딩(재개가능, scanned_demol 별도) · incr=증분, 기본)'
        type: choice
        default: incr
        options:
          - incr
          - reseed
          - full
          - demol

permissions:
  contents: write

jobs:
  # 증분(정기 실행 · mode=incr): 6샤드 병렬. 샤드는 서로 다른 러너라 IP도 갈려
  # 원천이 특정 IP를 느리게 물어도 전부가 같이 죽지 않는다.
  # mode=reseed도 같은 6샤드 잡을 쓴다. --full --reseed로 전량을 다시 훑되
  # meta['scanned']는 건드리지 않으므로(진행 추적은 meta['reseed_done']) 재시딩
  # 며칠 동안 hub_derive의 존 완결성 게이트가 계속 열려 있다 — 라이브가 pre-HUB로
  # 되돌아가지 않는다. 샤드가 340분에 끊겨도 재트리거하면 reseed_done부터 이어서 돈다.
  fetch:
    if: ${{ github.event_name == 'schedule' || (inputs.mode || 'incr') == 'incr' || inputs.mode == 'reseed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false      # 한 샤드가 죽어도 나머지는 계속 — merge가 알아서 뺀다
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 건축HUB 수집 (${{ inputs.mode || 'incr' }} · 샤드 ${{ matrix.shard }}/6)
        # STEP 타임아웃(340<잡 350)을 유지하는 이유는 예전과 같다: 잡이 통째
        # 취소되면 아래 업로드가 안 돌아 진행분이 소실된다.
        timeout-minutes: 340
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::error::DATA_GO_KR_KEY/DATAGOKR 시크릿이 비어 있음"; exit 1
          fi
          if [ "${{ inputs.mode }}" = "reseed" ]; then
            echo "전량 재시딩(샤드 ${{ matrix.shard }}/6). scanned는 유지하고 reseed_done으로 재개한다."
            python tools/fetch_hub_permits.py --full --reseed --shard ${{ matrix.shard }}/6
          else
            python tools/fetch_hub_permits.py --shard ${{ matrix.shard }}/6
          fi

      - name: 산출물 업로드
        # if:always() — 340분에 끊겨도 그때까지 save()된 진행분을 올린다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-shard-${{ matrix.shard }}
          path: tools/data/hub_permits.json
          retention-days: 3

  # 샤드 산출물을 하나로 합쳐 한 번만 커밋한다. 샤드가 각자 커밋하면 같은 파일에
  # 6-way 경합이 난다.
  merge:
    needs: fetch
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 샤드 내려받기
        uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: hub-shard-*

      - name: 병합
        run: |
          # 소유권은 위치(1..6)로 정해지므로 빠진 샤드 자리에는 베이스를 넣어
          # 순서를 유지한다 — 그 샤드의 그룹은 기존 값이 그대로 남는다.
          cp tools/data/hub_permits.json base.json
          FILES=""
          for i in 1 2 3 4 5 6; do
            f="shards/hub-shard-$i/hub_permits.json"
            if [ -f "$f" ]; then FILES="$FILES $f"
            else echo "::warning::샤드 $i 산출물 없음 — 해당 그룹은 기존 값 유지"; FILES="$FILES base.json"; fi
          done
          python tools/merge_hub_shards.py --base base.json --out tools/data/hub_permits.json --shards $FILES

      - name: 커밋 (hub_permits.json만 · data.js 재계산은 daily 워크플로가 담당)
        run: |
          git config user.name  "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- tools/data/hub_permits.json; then
            echo "변경 없음"; exit 0
          fi
          git add tools/data/hub_permits.json
          git commit -m "data: HUB ${{ inputs.mode || 'incr' }} 갱신 (6샤드 병합)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && { echo "푸시 완료"; break; }
            echo "push 재시도 $i"; sleep 5
          done

  # 전량 시딩(mode=full) / 멸실(mode=demol): 예전 그대로 단일 잡.
  # --full은 meta['scanned']를 건너뛰며 재개하므로 샤딩 없이도 재트리거로 끝난다.
  seed:
    if: ${{ github.event_name != 'schedule' && (inputs.mode || 'incr') != 'incr' && inputs.mode != 'reseed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 건축HUB 시딩 (${{ inputs.mode }})
        timeout-minutes: 340
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATAGOKR }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::error::DATA_GO_KR_KEY/DATAGOKR 시크릿이 비어 있음"; exit 1
          fi
          if [ "${{ inputs.mode }}" = "demol" ]; then
            echo "멸실 전량 시딩(RESUMABLE, scanned_demol 별도). 준공(scanned)은 안 건드림."
            python tools/fetch_hub_permits.py --demol --full
          else
            echo "전량 시딩(RESUMABLE) — 340분에 끊기면 mode=full로 재트리거하면 이어서 돈다."
            python tools/fetch_hub_permits.py --full
          fi

      - name: 커밋 (hub_permits.json만)
        if: always()
        run: |
          git config user.name  "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- tools/data/hub_permits.json; then
            echo "변경 없음"; exit 0
          fi
          git add tools/data/hub_permits.json
          git commit -m "data: HUB 시딩 진행분"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && { echo "푸시 완료"; break; }
            echo "push 재시도 $i"; sleep 5
          done
