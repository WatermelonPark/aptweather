name: 데이터 신선도 감시 (배치 실패 알림)

# 배치는 "자기가 실행되지 않았다"는 사실을 알릴 수 없다. PC가 꺼져 있거나 클라우드 런이
# 뜨지 않으면 배치 안의 어떤 알림 코드도 실행되지 않는다. 그래서 감시자는 외부에 둔다.
# 이 워크플로가 실패하면 GitHub이 실패 알림 메일을 보낸다.
#
# 검사 로직은 tools/check_freshness.py — 나이가 아니라 **원천과 직접 대조**한다.
# 나이만 보면 '정상 최대 나이'와 '한 회차 통째로 놓침'이 같은 값이라 구분되지 않는다
# (2026-07-30 실사고: 주간이 원천보다 한 주 뒤처졌는데 경과 10일이라 임계를 통과했다).
# 표 ID·주기 설정은 배치(update_adv_data.py)에서 import해 단일 출처를 유지한다.
#
# 이 한 번의 실행으로 다음이 전부 걸린다:
#   PC 꺼짐 / 배치 크래시 / git push 실패(토큰 만료) / Pages 배포 실패 /
#   산출물 채택 오류 / 특정 소스만 조용히 끊김(KOSIS 표 ID 변경·폐지)
#
# 잡이 둘인 이유(2026-08-01 오경보): KOSIS는 GitHub 러너 IP 일부를 간헐 차단한다.
# 나쁜 IP를 뽑으면 KOSIS 계열 10개가 통째로 timeout → SKIPPED 게이트가 red를 띄운다.
# 데이터는 멀쩡한데 감시자만 못 본 것이다. 러너 IP는 잡 단위로 새로 뽑히므로
# 1차 실패는 삼키고 **새 잡(=새 IP)** 으로 한 번 더 본다. 오경보율 12.5% → 1.6%.
# 오경보가 쌓이면 진짜 경보도 같이 묻힌다 — 그래서 이건 민감도가 아니라 신뢰도 문제다.
#
# ⚠️ recheck는 절대 삼키지 말 것. 재시도까지 나쁜 IP면 red가 맞다. 양쪽 다 관대하게
# 두면 '감시가 켜진 채 아무것도 안 보는' 상태가 되고, 그게 이 워크플로가 막으려는 것이다.
# check_freshness.py의 SKIPPED 게이트도 같은 이유로 손대지 말 것 — 그건 정상 동작이다.
#
# 잡 재시도(새 IP)와 별개로, 스크립트 안에도 재시도가 한 층 있다(2026-08-13):
# 원천 **자체**가 잠깐 죽으면 IP를 바꿔도 소용없다(2026-08-12: KOSIS·R-ONE 광역
# 타임아웃으로 14/18 실패 → 다음 날 자연 회복). check_freshness.py가 실패 계열만
# 75초 쉬었다 한 번 더 보고 판정한다. 게이트 자체는 그대로다 — 재시도까지 실패하면
# red. timeout-minutes 30은 그 예산이다.
# ⚠️ "1차 최악 ~15분"이라고 적혀 있었으나 산수가 틀렸다(2026-08-15 리뷰):
# 원천 대조는 17계열 = HTTP 21회 직렬이라 FETCH_TIMEOUT 60초 시절엔 1차만 21분,
# 대기·재시도까지 28~31분으로 이 30분을 넘겼다. 넘기면 ok 출력이 안 찍혀 판정
# 없이 죽고 recheck가 같은 30분을 또 쓴다. FETCH_TIMEOUT 60→25와 SITE_TIMEOUT
# 60→20(우리 사이트는 실측 0.3~0.5초인데 60초가 박혀 있었다)으로 1차 최악 ~11분,
# 전체 ~19분에 맞췄다. 산수는 check_freshness.py 상단 주석에 있다 — 바꿀 땐
# 호출 수 × 타임아웃을 **곱해서** 확인할 것.

on:
  schedule:
    # 22:07 KST — 그날의 마지막 배치가 끝난 뒤에 본다(2026-08-14부터 일일 배치는
    # 17:00 KST, 목요일만 20:00 KST 백스톱이 하나 더 돈다 — update-cloud.yml).
    # 배치 앞에서 돌리면 '발표됐지만 아직 안 받은' 정상 구간을 실패로 읽어
    # 매주 오탐이 난다. 시각을 옮길 땐 check_freshness.py의 GRACE_WEEKLY도 함께 볼 것.
    # 분(minute)이 7인 이유: 정각 예약은 전 세계가 몰려 GitHub 큐에서 가장 밀린다
    # (실측 2026-08-06~12: 매일 +47~136분). 정각을 피하라는 건 GitHub 문서의 공식
    # 완화책이고, 그래도 지연 자체는 남는다 — 스케줄은 best-effort라 우리가 못 없앤다.
    # 목 20:00 백스톱(11:00 UTC, 실측 +49~70분 지연)이 끝나고도 1시간 이상 여유가
    # 있어, 감시가 제때 떠도 배치를 앞지르는 역전은 없다. 단 그 회차가 0/3 전멸로
    # 재시도 체인(35분×최대 2회)에 들어가면 감시가 먼저 볼 수 있는데, 그 경우는
    # 어차피 데이터가 없어 red가 맞고 다음 날 자연 해소된다.
    - cron: '7 13 * * *'
  workflow_dispatch: {}

jobs:
  # 1차: 스스로 red가 되지 않는다(종료코드를 삼킨다). 판정은 아래 두 잡이 나눠 맡는다.
  #
  # verdict 세 값과 그 뒤에 도는 잡:
  #   ok    → 아무 잡도 안 돈다 → green
  #   retry → recheck(새 러너=새 IP)가 판정한다  ← 조회 실패가 섞였을 때
  #   final → alert가 즉시 red를 만든다          ← 조회는 다 됐고 데이터 문제일 때
  # 그 외(빈 값·모르는 값·이 잡이 타임아웃으로 죽음) → **retry로 떨어진다.**
  # 조건을 `== 'retry'`가 아니라 `!= 'ok' && != 'final'`로 쓴 이유가 이것이다 —
  # 판정을 못 남기고 죽은 회차가 조용히 넘어가면 안 된다.
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 스크립트 내부 재시도 예산 포함(위 주석)
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: IP 프리플라이트
        id: pre
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
        run: |
          # 나쁜 IP면 KOSIS 호출마다 60s씩 먹어 잡이 10분 넘게 hang한다. 작은 호출
          # 하나로 15초 내 판정해서, 나쁜 IP면 대조를 건너뛰고 바로 recheck로 넘긴다.
          # 속도 최적화 겸 진단이다 — 로그에 '나쁜 IP'와 '진짜 뒤처짐'이 구분돼 남는다.
          if [ -z "$KOSIS_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "KOSIS 시크릿 없음 — 대조는 진행(키 누락도 감시 대상)"; exit 0; fi
          if python - << 'PY'
          import os, sys, urllib.parse, urllib.request
          u='https://kosis.kr/openapi/Param/statisticsParameterData.do?'+urllib.parse.urlencode(
            dict(method='getList',apiKey=os.environ['KOSIS_API_KEY'],format='json',jsonVD='Y',
                 orgId='408',tblId='DT_304004_WEEK_001_B',objL1='ALL',itmId='ALL',prdSe='F',
                 startPrdDe='20260601',endPrdDe='20260620'))
          try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              urllib.request.urlopen(req,timeout=15).read()
          except Exception as e:
              print('나쁜 IP:',type(e).__name__); sys.exit(1)
          PY
          then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "프리플라이트 OK — 좋은 IP"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "이 러너 나쁜 IP — 대조 건너뛰고 새 IP로 재확인"
          fi

      - name: 라이브 데이터와 원천 대조
        id: check
        if: steps.pre.outputs.ok == 'true'
        env:
          # 배치(update-cloud.yml)와 같은 폴백 이름을 쓴다 — 한쪽만 고쳐두면
          # 키가 비어 원천 조회가 통째로 '건너뜀'이 되고 감시가 조용히 무력해진다.
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY || secrets.RONE }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY || secrets.ECOS }}
        run: |
          # 여기서 종료코드로 죽으면 잡이 red가 되므로 삼킨다 — 판정은 아래 잡이 한다.
          # 종료코드: 0 정상 · 2 결정론적 실패(재확인 무의미) · 그 외 조회 실패 섞임.
          RC=0
          python tools/check_freshness.py || RC=$?
          if [ "$RC" = "0" ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "2" ]; then
            # 조회는 전부 성공했고 데이터 자체가 문제다. 새 IP로 다시 봐도 답이
            # 같으므로 recheck를 건너뛰고 바로 경보한다 — 예전엔 이 경우에도
            # 21회 호출과 최대 30분을 다시 썼다(2026-08-15 리뷰).
            echo "verdict=final" >> "$GITHUB_OUTPUT"
            echo "::warning::1차 대조 실패(결정론) — 재확인 없이 바로 경보한다"
          else
            echo "verdict=retry" >> "$GITHUB_OUTPUT"
            echo "::warning::1차 대조 실패 — 새 러너(=새 IP)로 재확인한다"
          fi

  # 2차: 조회 실패가 섞였을 때의 판정자. 실패하면 그대로 red → GitHub 실패 메일.
  #
  # ⚠️ 조건이 `== 'retry'`가 아니라 `!= 'ok' && != 'final'`인 것이 핵심이다.
  # 1차가 판정을 못 남기고 죽는 경로가 실재한다 — 프리플라이트가 '나쁜 IP'로
  # 대조 스텝을 건너뛰면 verdict가 비고, 잡이 timeout-minutes에 걸려 죽어도 빈다.
  # `== 'retry'`로 썼으면 그 회차들이 **아무 경보 없이 통과**한다. `!cancelled()`도
  # 같은 이유다 — 커스텀 if를 쓰면 needs 잡이 실패했을 때 기본적으로 건너뛰는데,
  # 1차가 죽은 회차야말로 재확인이 필요한 회차다.
  recheck:
    needs: freshness
    if: ${{ !cancelled() && needs.freshness.outputs.verdict != 'ok' && needs.freshness.outputs.verdict != 'final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 스크립트 내부 재시도 예산 포함(위 주석)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 새 IP로 재대조 (여기서 실패하면 진짜 경보)
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY || secrets.KOSIS }}
          RONE_API_KEY: ${{ secrets.RONE_API_KEY || secrets.RONE }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY || secrets.ECOS }}
        run: python tools/check_freshness.py

  # 3차 아님 — recheck의 **대안**이다. 둘 중 정확히 하나만 돈다.
  # 조회가 전부 성공했는데 실패가 났다면 원인은 데이터 쪽이고, 새 IP로 다시 봐도
  # 답이 같다. 그 확인에 21회 호출과 30분을 또 쓰는 대신 여기서 바로 red를 만든다.
  # 사유는 freshness 잡 로그의 FAIL 목록에 그대로 있다.
  alert:
    needs: freshness
    if: ${{ !cancelled() && needs.freshness.outputs.verdict == 'final' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 결정론적 실패 — 즉시 경보
        run: |
          echo "::error::라이브 데이터 대조 실패(결정론) — 원천 조회는 전부 성공했다."
          echo "새 IP로 재확인해도 결과가 같으므로 recheck를 건너뛰었다."
          echo "실패 목록은 이 실행의 'freshness' 잡 로그 맨 아래 FAIL 항목을 볼 것."
          echo "→ update-cloud 실행 이력, KOSIS 표 ID 변경/폐지 여부 확인"
          exit 1
