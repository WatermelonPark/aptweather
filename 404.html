<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>
<title>페이지를 찾을 수 없습니다 — 아공맵</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/app_icon.png">
<style>b,strong{font-weight:600}
  :root{--ink:#131e24;--ink2:#4c5f66;--paper:#f4f6f5;--muted:#5e6f74;--line:#c4cec9;--jeonse:#6c4ab6;--stock:#1f8a70}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);min-height:100vh;
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;text-align:center;position:relative}
  .wrap::before{content:"";position:absolute;left:50%;top:-40px;width:280px;height:280px;
    transform:translateX(-50%);border:1.5px solid var(--line);border-radius:0;opacity:.4;z-index:0}
  .inner{position:relative;z-index:1}
  .code{font-size:72px;font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1;margin-bottom:8px}
  .cycle{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:20px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:14px}
  p{font-size:15px;color:var(--ink2);line-height:1.6;margin-bottom:28px}
  /* 그림자 없는 먹색 채움 — 주 CTA 어휘(홈 .home-cta·.tb-more)와 통일.
     장식 그림자는 원부 정리 때 걷은 것의 잔재였다(2026-08-14 검수). */
  a.home{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;
    font-size:16px;font-weight:600;padding:14px 32px;border-radius:3px}
  a.home:active{transform:scale(.98)}
  .foot{margin-top:24px;font-size:12.5px;color:var(--muted)}

/* 하단 네비 — 이 페이지는 공용 스타일시트를 안 쓰므로 필요한 규칙만 동봉
   (2026-08-14 검수: 페이지마다 네비 유무가 달라 막다른 페이지가 생겼다).
   활성 탭 없음 — 문서 페이지는 네 탭 어디에도 속하지 않는다.
   ⚠️ 주석에도 공용 시트의 파일명을 쓰지 말 것 — audit_design의 공유 판정이
   문자열 검색이라 주석의 파일명만으로 그 시트의 그림자까지 합산된다. */
body{padding-bottom:66px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--ink);
  display:flex;justify-content:center;z-index:100;box-shadow:0 -4px 18px rgba(19,30,36,.28)}
.nav-btn{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:#97a0b8;font-size:11.5px;font-weight:600;
  text-decoration:none}
.nav-btn svg{display:block}
</style>
</head>
<body>
<div class="wrap"><div class="inner">
  <div class="code">404</div>
  <div class="cycle">아공맵</div>
  <h1>찾으시는 페이지가 없네요</h1>
  <p>주소가 바뀌었거나 사라진 페이지예요.<br>공급 사이클 리포트는 아래에서 다시 시작할 수 있습니다.</p>
  <a class="home" href="/">홈으로 가기 →</a>
  <div class="foot">agongmap.co.kr</div>
</div></div>
<nav class="bottomnav">
  <a class="nav-btn" href="/"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>홈</span></a>
  <a class="nav-btn" href="/zone/"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21s-7-5.8-7-11a7 7 0 0 1 14 0c0 5.2-7 11-7 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>지역</span></a>
  <a class="nav-btn" href="/#stats"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>통계</span></a>
  <a class="nav-btn" href="/cycle/"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20.3 3.7v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>사이클</span></a>
</nav>
</body>
</html>
